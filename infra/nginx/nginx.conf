upstream django_backend {
    server backend:8000;
}

# ---------------------------------------------------------------------------
# HTTP server
# ---------------------------------------------------------------------------
# For local/demo use this serves plain HTTP. In production, provision a TLS
# certificate (see the commented HTTPS block below), then uncomment the redirect
# so all traffic is forced onto HTTPS.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # Redirect HTTP to HTTPS in production (enable once the 443 block is active)
    # return 301 https://$host$request_uri;

    client_max_body_size 20M;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }
}

