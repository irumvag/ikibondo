# Ikibondo edge proxy: TLS termination, security headers, routing to the
# Next.js frontend and the Django API. Certificates are mounted at /etc/nginx/certs
# (fullchain.pem + privkey.pem), e.g. from Let's Encrypt / certbot.

upstream django_backend { server backend:8000; }
upstream next_frontend  { server frontend:3000; }

# Plain HTTP only redirects to HTTPS (and answers ACME challenges for certificate renewal)
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    server_tokens off;
    client_max_body_size 10M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;

    # Child photos: never publicly addressable. Django checks the signed link and
    # answers with X-Accel-Redirect; only then does nginx stream the file.
    location /protected-media/ {
        internal;
        alias /app/media/;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Django: API, admin
    location ~ ^/(api|admin)/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        # Overwrite (not append) so clients cannot spoof their address in audit logs
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # Everything else: the Next.js app
    location / {
        proxy_pass http://next_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
