# Production-style stack. Only nginx is reachable from outside (ports 80/443);
# the database, Redis, Django and Next.js talk on the private compose network.
#
# Required in infra/docker/.env (never committed):
#   POSTGRES_PASSWORD=...   REDIS_PASSWORD=...   PUBLIC_API_URL=https://your-domain/api/v1
# Backend settings (SECRET_KEY, ALLOWED_HOSTS, FIREBASE_CREDENTIALS_FILE, ...) stay in backend/.env.

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.prod
  DB_HOST: db
  DB_NAME: ikibondo
  DB_USER: ikibondo
  DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/docker/.env}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in infra/docker/.env}@redis:6379/0

services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ikibondo
      POSTGRES_USER: ikibondo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/docker/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ikibondo"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in infra/docker/.env}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  backend:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment: *backend-env
    env_file:
      - ../../backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    restart: unless-stopped

  celery:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.backend
    command: celery -A config worker --loglevel=info --concurrency=2
    environment: *backend-env
    env_file:
      - ../../backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_files:/app/media
    restart: unless-stopped

  celery-beat:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.backend
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule
    environment: *backend-env
    env_file:
      - ../../backend/.env
    depends_on:
      - celery
    restart: unless-stopped

  frontend:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL in infra/docker/.env}
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/certs:/etc/nginx/certs:ro
      - certbot_webroot:/var/www/certbot:ro
      - media_files:/app/media:ro
      - static_files:/app/staticfiles:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  media_files:
  static_files:
  certbot_webroot:
