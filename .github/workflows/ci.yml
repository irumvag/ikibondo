name: CI

on:
  push:
    branches: [main, staging, dev]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ikibondo
          POSTGRES_USER: ikibondo
          POSTGRES_PASSWORD: ikibondo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ikibondo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # base.py reads these; values match the postgres service above.
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: ikibondo
      DB_USER: ikibondo
      DB_PASSWORD: ikibondo
      SECRET_KEY: ci-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Django system checks
        run: python manage.py check
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
      - name: Tests
        run: pytest -q -o addopts=""

  backend-security:
    name: Backend security scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit pip-audit
      # Report-only until the existing findings are triaged; flip to blocking afterwards
      - name: Bandit (static analysis)
        run: bandit -r apps config -x '*/tests/*,*/migrations/*,*/tests.py' -ll
        continue-on-error: true
      - name: pip-audit (known CVEs)
        run: pip-audit -r requirements/prod.txt
        continue-on-error: true

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24: a dependency (@zxing/library) requires node >= 24.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: npm audit (high+)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Code generation (drift)
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze (errors fail the build; deprecation notices don't)
        run: flutter analyze --no-fatal-infos
      # Drift's NativeDatabase.memory() in unit tests needs a host sqlite3.
      - name: Install host sqlite3 for drift tests
        run: sudo apt-get update -q && sudo apt-get install -y -q libsqlite3-dev
      - name: Tests
        run: flutter test

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --verbose --exit-code 1

  # Deploy-readiness: verify the production images build. Nothing is pushed.
  docker-build:
    name: Image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.backend
          push: false
          tags: ikibondo-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.frontend
          push: false
          tags: ikibondo-frontend:ci
          build-args: NEXT_PUBLIC_API_URL=https://example.invalid/api/v1
