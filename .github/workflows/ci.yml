name: CI

on:
  push:
    branches: [main, dev, rebuild-2026]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ikibondo
          POSTGRES_USER: ikibondo
          POSTGRES_PASSWORD: ikibondo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ikibondo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # base.py reads these; values match the postgres service above.
      DB_HOST: localhost
      DB_NAME: ikibondo
      DB_USER: ikibondo
      DB_PASSWORD: ikibondo
      SECRET_KEY: ci-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Django system checks
        run: python manage.py check
      - name: Tests
        run: pytest

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Build
        run: npm run build

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Latest stable — the project's deps (flutter_lints ^6) need Dart >= 3.8.
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Code generation (drift / json_serializable)
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: flutter test

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --verbose --exit-code 1

  # Deploy-readiness: verify the production backend image builds. It is not
  # pushed anywhere — wiring an actual deployment (push to a registry + deploy to
  # a host / Vercel / Fly / etc.) requires a target and secrets to be provided.
  docker-build:
    name: Backend image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.backend
          push: false
          tags: ikibondo-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
