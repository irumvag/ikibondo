name: ikibondo
description: "Ikibondo — Child Nutrition Monitoring Platform for Refugee Camps"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^17.2.3

  # State management (Riverpod 3 Notifier API — no codegen)
  flutter_riverpod: ^3.3.1

  # HTTP
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1

  # SHA-256 fingerprinting for TLS certificate pinning
  crypto: ^3.0.3

  # Secure token storage
  flutter_secure_storage: ^10.2.0

  # Offline database (encrypted at rest via SQLCipher).
  # sqlcipher_flutter_libs REPLACES sqlite3_flutter_libs — do not depend on both,
  # or the plain sqlite3 native library may be linked instead of SQLCipher.
  drift: ^2.18.0
  sqlcipher_flutter_libs: ^0.6.0
  sqlite3: ^2.4.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # QR Scanning
  mobile_scanner: ^7.2.0

  # QR Display (child identity card)
  qr_flutter: ^4.1.0

  # Charts (growth charts)
  fl_chart: ^1.2.0

  # Connectivity
  connectivity_plus: ^7.1.1

  # Date formatting
  intl: ^0.20.2

  # URL launching (tel: links for CHW contact)
  url_launcher: ^6.3.0

  # UUID generation (for offline operation IDs)
  uuid: ^4.4.0

  # Push notifications (FCM HTTP v1; needs the Firebase config files to activate)
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  package_info_plus: ^10.2.2

  # Biometric / passcode app lock
  local_auth: ^3.0.2

  # Bluetooth weight scales (standard Weight Scale Service)
  flutter_blue_plus: ^1.34.5

  # Google Fonts (Inter)
  google_fonts: ^8.1.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.18.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: assets/icon.png
  ios: true
  remove_alpha_ios: true
  android: true
  adaptive_icon_background: "#16324F"
  adaptive_icon_foreground: assets/icon_foreground.png
