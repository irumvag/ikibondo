name: ikibondo
description: "Ikibondo — Child Nutrition Monitoring Platform for Refugee Camps"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^17.2.3

  # State management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # HTTP
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1

  # SHA-256 fingerprinting for TLS certificate pinning
  crypto: ^3.0.3

  # Secure token storage
  flutter_secure_storage: ^10.2.0

  # Offline database (encrypted at rest via SQLCipher).
  # sqlcipher_flutter_libs REPLACES sqlite3_flutter_libs — do not depend on both,
  # or the plain sqlite3 native library may be linked instead of SQLCipher.
  drift: ^2.18.0
  sqlcipher_flutter_libs: ^0.6.0
  sqlite3: ^2.4.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # QR Scanning
  mobile_scanner: ^7.2.0

  # QR Display (child identity card)
  qr_flutter: ^4.1.0

  # Charts (growth charts)
  fl_chart: ^1.2.0

  # JSON serialization
  json_annotation: ^4.9.0

  # Connectivity
  connectivity_plus: ^7.1.1

  # Date formatting
  intl: ^0.20.2

  # Image picker (child photo)
  image_picker: ^1.1.2

  # URL launching (tel: links for CHW contact)
  url_launcher: ^6.3.0

  # UUID generation (for offline operation IDs)
  uuid: ^4.4.0

  # Google Fonts (Inter)
  google_fonts: ^8.1.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.18.0
  json_serializable: ^6.8.0
  riverpod_generator: ^4.0.3

flutter:
  uses-material-design: true
